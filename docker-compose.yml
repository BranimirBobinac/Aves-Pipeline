version: '3.8'



services:

  # ── MONGODB
  mongodb:
    image: mongo:7.0
    container_name: birds_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongouser
      MONGO_INITDB_ROOT_PASSWORD: mongopass123
      MONGO_INITDB_DATABASE: birds_db
    ports:
      - "27017:27017"           
    volumes:
      - mongo_data:/data/db     
    restart: unless-stopped

  # ── MINIO (S3-kompatibilna pohrana)
  minio:
    image: minio/minio:latest
    container_name: birds_minio
    environment:
      MINIO_ROOT_USER: minioadmin         
      MINIO_ROOT_PASSWORD: minioadmin123   
    ports:
      - "9000:9000"             
      - "9001:9001"             
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"  
    restart: unless-stopped

  # ── ZOOKEEPER
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: birds_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ── KAFKA
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: birds_kafka
    depends_on:
      - zookeeper             
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true" 
    ports:
      - "9092:9092"           

volumes:
  mongo_data:
  minio_data:
